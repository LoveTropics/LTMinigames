modLoader = "javafml"
loaderVersion = "[2,)"
issueTrackerURL = "https://github.com/LoveTropics/LTMinigames/issues"
license = "Mozilla Public License Version 2.0"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "LTMinigames - Lobbies"
displayURL = "https://lovetropics.org"
authors = "The Love Tropics team"
description = '''
Lobby-based game runner for Love Tropics.
'''

[[mixins]]
config = "ltgames_lobbies.mixins.json"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

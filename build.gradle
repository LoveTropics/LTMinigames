plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id 'conventions'
}

group = 'org.lovetropics'
base {
    archivesName = 'LTMinigames'
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude 'testing/**'
}
sourceSets.test.resources {
    srcDir 'src/generated/resources'
    include 'testing/**'
    include 'data/ltminigames/structure/**'
}

def mod_id = 'ltminigames'

conventions {
    modId = mod_id
}

neoForge {
    addModdingDependenciesTo sourceSets.test

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${mod_id}_test" {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods."${mod_id}"]

            programArguments.addAll '--username', 'Dev###'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            loadedMods = [mods."${mod_id}"]

            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.test
            loadedMods = [mods."${mod_id}_test"]

            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            clientData()
            loadedMods = [mods."${mod_id}_test"]

            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            ideName = project.name + " - " + ideName.get()
            jvmArgument("-Dmixin.debug.export=true")
        }
    }
}

repositories {
    maven {
        url = 'https://maven.gegy.dev/releases'
        content {
            includeGroup 'org.lovetropics'
            includeGroup 'com.tterrag.registrate'
            includeGroup 'eu.pb4'
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup('curse.maven')
        }
    }
}

dependencies {
    runtimeOnly 'maven.modrinth:tropicraft:9.11.0+26.2'

    jarJar("com.tterrag.registrate:Registrate:MC26.2-${registrate_version}") {
        version {
            strictly "[MC26.2-${registrate_version},MC26.3)"
            prefer "MC26.2-${registrate_version}"
        }
    }

    jarJar("org.lovetropics:LTLib:$ltlib_version")

    runtimeOnly "org.lovetropics:LTExtras:$ltextras_version"

    jarJar(compileOnly("org.lovetropics:peekaboo-api:$peekaboo_version"))
    runtimeOnly("org.lovetropics:peekaboo:$peekaboo_version") {
        transitive = false
    }

    runtimeOnly "org.lovetropics:lt-multimedia:$multimedia_version"

    testImplementation platform("org.junit:junit-bom:5.7.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

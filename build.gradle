plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id 'eclipse'
    id 'idea'
    id 'java-library'
}

group = 'org.lovetropics'
base {
    archivesName = 'LTMinigames'
}

def env = System.getenv()
if (env.GITHUB_RUN_NUMBER) {
    version = "$mod_version.${env.GITHUB_RUN_NUMBER}"
} else {
    version = "$mod_version.0-SNAPSHOT"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

ext {
    /*
    Additional modules to add to the project, for splitting features up.
    By default the modules will have access to the main source set, minecraft, and add libraries.
    */
    splitModules = [
            'lobbies'
    ]
    //A map of game id's to display names to add quick run tasks for.
    quickLoadMods = [
        "lt:survive_the_tide/1/normal": "Survive the Tide 1 - Normal",
        "lt:block_party/normal": "Block Party - Normal"
    ]
}

for (String name : splitModules) {
    sourceSets.create(name) {
        resources.srcDir "src/generated/resources/ltgames_${name}"
    }
}

sourceSets.test.resources {
    include 'testing/**'
    include 'data/ltminigames/structure/**'
}

sourceSets.main.resources {
    srcDir 'src/generated/resources/ltminigames'
    exclude 'testing/**'
}

def mod_id = 'ltminigames'

configurations {
    libImplementation
    libCompileOnly
    implementation.extendsFrom libImplementation
    compileOnly.extendsFrom libCompileOnly
}

for (String name : splitModules) {
    def sourceSet = sourceSets.named(name).get()
    def libImplementation = configurations.named("libImplementation").get()
    def libCompileOnly = configurations.named("libCompileOnly").get()
    configurations.named(sourceSet.implementationConfigurationName).get().extendsFrom libImplementation
    configurations.named(sourceSet.compileOnlyConfigurationName).get().extendsFrom libCompileOnly
}

neoForge {
    version = project.neo_version

    addModdingDependenciesTo sourceSets.test

    for (String name : splitModules) {
        def sourceSet = sourceSets.named(name)
        addModdingDependenciesTo(sourceSet.get())
    }

    mods.create(mod_id) {
        it.sourceSet(sourceSets.main)
        for (String name : splitModules) {
            def sourceSet = sourceSets.named(name)
            it.sourceSet(sourceSet.get())
        }
    }

    mods.create("${mod_id}_test") {
        sourceSet sourceSets.main
        sourceSet sourceSets.test
    }

    def defaultModsToLoad = [mods.named(mod_id).get()]

    def allModIds = [mod_id]
    allModIds += splitModules.collect { "ltgames_$it" }

    runs {
        client {
            client()
            loadedMods = defaultModsToLoad
            programArguments.addAll '--username', 'Dev###'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            loadedMods.addAll defaultModsToLoad
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.test

            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            clientData()
            loadedMods.addAll defaultModsToLoad

            programArguments.addAll '--mod', allModIds.join(','), '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath

            for (String name : splitModules) {
                programArguments.addAll('--existing', file("src/${name}/resources/").absolutePath)
            }
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            ideName = project.name + " - " + ideName.get()
            jvmArgument("-Dmixin.debug.export=true")
        }

        quickLoadMods.each { gameId, runDisplayName ->
            def runName = "quickPlay_${gameId.replaceAll(':', '_')}".toLowerCase().replace("/", "")
            it.create(runName) {
                client()
                ideName = runDisplayName
                loadedMods = defaultModsToLoad
                programArguments.addAll '--username', 'Dev###'
                programArguments.addAll '--quickPlayMinigame', gameId
                ideFolderName = "Quick Play"
            }
        }
    }
}

repositories {
    maven {
        url = 'https://maven.gegy.dev/releases'
        content {
            includeGroup 'org.lovetropics'
            includeGroup 'com.tterrag.registrate'
            includeGroup 'eu.pb4'
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup('curse.maven')
        }
    }
}

dependencies {
    jarJar(libImplementation "org.lovetropics:LTLib:$ltlib_version")
    jarJar(libCompileOnly "org.lovetropics:peekaboo-api:$peekaboo_version")
    libCompileOnly "com.tterrag.registrate:Registrate:MC26.2-${registrate_version}"

    runtimeOnly 'maven.modrinth:tropicraft:9.11.0+26.2'
    runtimeOnly("org.lovetropics:peekaboo:$peekaboo_version") {
        transitive = false
    }
    runtimeOnly "org.lovetropics:lt-multimedia:$multimedia_version"
    runtimeOnly "org.lovetropics:LTExtras:$ltextras_version"

    // TODO: HACK - We get Registrate at runtime through JarJar from Tropicraft. We should rather prefer to depend on the slim jar.
    jarJar("com.tterrag.registrate:Registrate:MC26.2-${registrate_version}") {
        version {
            strictly "[MC26.2-${registrate_version},MC26.3)"
            prefer "MC26.2-${registrate_version}"
        }
    }

    testImplementation platform("org.junit:junit-bom:5.7.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    runtimeOnly sourceSets.lobbies.output

    for (String module : splitModules) {
        "${sourceSets.named(module).get().implementationConfigurationName}" sourceSets.main.output
        testImplementation sourceSets.named(module).get().output
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xmaxerrs" << "100000"
}

tasks.named('jar', Jar) {
    from([sourceSets.main.output])
    for (String name : splitModules) {
        def sourceSet = sourceSets.named(name)
        from(sourceSet.get().output)
    }
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    outputs.upToDateWhen { false }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
